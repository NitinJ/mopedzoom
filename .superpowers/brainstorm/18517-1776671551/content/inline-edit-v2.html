<h2>Playbook editor — with add/remove stages</h2>
<p class="subtitle">Updated mockup showing stage management controls</p>

<div class="mockup">
  <div class="mockup-header">http://localhost:7777/playbooks — research (expanded)</div>
  <div class="mockup-body" style="padding:1.25rem">

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem">
      <div>
        <label style="display:block;font-size:0.75rem;color:#94a3b8;margin-bottom:4px;text-transform:uppercase;letter-spacing:0.05em">Summary</label>
        <input value="Research a topic and produce a markdown report" style="width:100%;box-sizing:border-box;background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:6px 10px;border-radius:4px;font-size:0.85rem;font-family:inherit">
      </div>
      <div>
        <label style="display:block;font-size:0.75rem;color:#94a3b8;margin-bottom:4px;text-transform:uppercase;letter-spacing:0.05em">Triggers (comma-separated)</label>
        <input value="research, investigate, look into, dig into" style="width:100%;box-sizing:border-box;background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:6px 10px;border-radius:4px;font-size:0.85rem;font-family:inherit">
      </div>
    </div>

    <label style="display:block;font-size:0.75rem;color:#94a3b8;margin-bottom:0.5rem;text-transform:uppercase;letter-spacing:0.05em">Stages</label>

    <!-- Existing stages -->
    <div style="display:flex;flex-direction:column;gap:0.5rem;margin-bottom:0.75rem">

      <!-- Stage 0 -->
      <div style="background:#1e293b;border:1px solid #334155;border-radius:4px;padding:0.75rem">
        <div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.5rem">
          <span style="font-size:0.7rem;color:#64748b;font-family:monospace;background:#0f172a;padding:2px 7px;border-radius:3px">0</span>
          <input value="pre-brief" style="flex:1;background:#0f172a;border:1px solid #334155;color:#60a5fa;padding:4px 8px;border-radius:4px;font-size:0.82rem;font-family:monospace">
          <button title="Remove stage" style="font-size:0.75rem;padding:3px 8px;background:transparent;border:1px solid #7f1d1d;color:#f87171;border-radius:4px;cursor:pointer;line-height:1">✕</button>
        </div>
        <textarea rows="2" placeholder="Stage prompt (requires)" style="width:100%;box-sizing:border-box;background:#0f172a;border:1px solid #334155;color:#e2e8f0;padding:6px 10px;border-radius:4px;font-size:0.82rem;font-family:inherit;resize:vertical">Scope the research: sources, depth, key questions</textarea>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.5rem;margin-top:0.5rem">
          <div>
            <label style="display:block;font-size:0.7rem;color:#64748b;margin-bottom:3px">Produces</label>
            <input value="pre-brief.md" style="width:100%;box-sizing:border-box;background:#0f172a;border:1px solid #334155;color:#94a3b8;padding:4px 8px;border-radius:4px;font-size:0.8rem;font-family:monospace">
          </div>
          <div>
            <label style="display:block;font-size:0.7rem;color:#64748b;margin-bottom:3px">Approval</label>
            <select style="width:100%;box-sizing:border-box;background:#0f172a;border:1px solid #334155;color:#94a3b8;padding:4px 8px;border-radius:4px;font-size:0.8rem">
              <option selected>required</option>
              <option>on-completion</option>
              <option>none</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Stage 1 -->
      <div style="background:#1e293b;border:1px solid #334155;border-radius:4px;padding:0.75rem">
        <div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.5rem">
          <span style="font-size:0.7rem;color:#64748b;font-family:monospace;background:#0f172a;padding:2px 7px;border-radius:3px">1</span>
          <input value="research" style="flex:1;background:#0f172a;border:1px solid #334155;color:#60a5fa;padding:4px 8px;border-radius:4px;font-size:0.82rem;font-family:monospace">
          <button title="Remove stage" style="font-size:0.75rem;padding:3px 8px;background:transparent;border:1px solid #7f1d1d;color:#f87171;border-radius:4px;cursor:pointer;line-height:1">✕</button>
        </div>
        <textarea rows="2" placeholder="Stage prompt (requires)" style="width:100%;box-sizing:border-box;background:#0f172a;border:1px solid #334155;color:#e2e8f0;padding:6px 10px;border-radius:4px;font-size:0.82rem;font-family:inherit;resize:vertical">Perform the research; produce a detailed markdown report with citations</textarea>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.5rem;margin-top:0.5rem">
          <div>
            <label style="display:block;font-size:0.7rem;color:#64748b;margin-bottom:3px">Produces</label>
            <input value="report.md" style="width:100%;box-sizing:border-box;background:#0f172a;border:1px solid #334155;color:#94a3b8;padding:4px 8px;border-radius:4px;font-size:0.8rem;font-family:monospace">
          </div>
          <div>
            <label style="display:block;font-size:0.7rem;color:#64748b;margin-bottom:3px">Approval</label>
            <select style="width:100%;box-sizing:border-box;background:#0f172a;border:1px solid #334155;color:#94a3b8;padding:4px 8px;border-radius:4px;font-size:0.8rem">
              <option>required</option>
              <option selected>on-completion</option>
              <option>none</option>
            </select>
          </div>
        </div>
      </div>

      <!-- NEW stage (just added) -->
      <div style="background:#0d2137;border:1px dashed #3b82f6;border-radius:4px;padding:0.75rem">
        <div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.5rem">
          <span style="font-size:0.7rem;color:#64748b;font-family:monospace;background:#0f172a;padding:2px 7px;border-radius:3px">2</span>
          <input placeholder="stage-name" style="flex:1;background:#0f172a;border:1px solid #334155;color:#60a5fa;padding:4px 8px;border-radius:4px;font-size:0.82rem;font-family:monospace">
          <button title="Remove stage" style="font-size:0.75rem;padding:3px 8px;background:transparent;border:1px solid #7f1d1d;color:#f87171;border-radius:4px;cursor:pointer;line-height:1">✕</button>
        </div>
        <textarea rows="2" placeholder="Stage prompt (requires)" style="width:100%;box-sizing:border-box;background:#0f172a;border:1px solid #334155;color:#e2e8f0;padding:6px 10px;border-radius:4px;font-size:0.82rem;font-family:inherit;resize:vertical"></textarea>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.5rem;margin-top:0.5rem">
          <div>
            <label style="display:block;font-size:0.7rem;color:#64748b;margin-bottom:3px">Produces</label>
            <input placeholder="output.md" style="width:100%;box-sizing:border-box;background:#0f172a;border:1px solid #334155;color:#94a3b8;padding:4px 8px;border-radius:4px;font-size:0.8rem;font-family:monospace">
          </div>
          <div>
            <label style="display:block;font-size:0.7rem;color:#64748b;margin-bottom:3px">Approval</label>
            <select style="width:100%;box-sizing:border-box;background:#0f172a;border:1px solid #334155;color:#94a3b8;padding:4px 8px;border-radius:4px;font-size:0.8rem">
              <option selected>required</option>
              <option>on-completion</option>
              <option>none</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <!-- Add Stage button -->
    <button style="width:100%;padding:8px;background:transparent;border:1px dashed #334155;color:#475569;border-radius:4px;cursor:pointer;font-size:0.82rem;margin-bottom:1rem">+ Add Stage</button>

    <div style="display:flex;gap:0.5rem;justify-content:flex-end">
      <button style="font-size:0.8rem;padding:5px 14px;background:transparent;border:1px solid #334155;color:#94a3b8;border-radius:4px;cursor:pointer">Cancel</button>
      <button style="font-size:0.8rem;padding:5px 14px;background:#166534;border:1px solid #4ade80;color:#4ade80;border-radius:4px;cursor:pointer">Save &amp; Reload</button>
    </div>

  </div>
</div>
